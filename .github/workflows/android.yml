name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install and build web app
        run: |
          npm install
          npm run build
      - name: Add Capacitor Android
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $M
          R=android/app/src/main/res
          cp -r res/mipmap-* $R/
          rm -f $R/drawable-v24/ic_launcher_foreground.xml $R/drawable/ic_launcher_foreground.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#2358F0" android:pathData="M0,0h108v108h-108z"/></vector>\n' > $R/drawable/ic_launcher_background.xml
          find $R -name 'splash.png' -exec cp res/splash.png {} \;
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fynza-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FYNZA.apk
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" FYNZA.apk --title "FYNZA APK (build ${{ github.run_number }})" --notes "Debug APK built by GitHub Actions. Install on Android (allow unknown sources)."
